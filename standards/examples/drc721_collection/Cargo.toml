[package]
name = "drc721-collection"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_family = "wasm")'.dependencies]
dusk-core = "=1.6.0"
dusk-data-driver = { version = "=0.3.2-alpha.1", optional = true }
dusk-forge = "=0.3.0"
dusk-contract-standards = { path = "../../dusk-contract-standards" }
bytecheck = { workspace = true }
rkyv = { workspace = true, features = ["size_32", "alloc", "validation"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }
serde_json = { version = "1", default-features = false, features = ["alloc"], optional = true }

[features]
contract = ["dusk-core/abi-dlmalloc", "dusk-contract-standards/contract"]
serde = ["dep:serde", "dusk-contract-standards/serde"]
data-driver = [
    "serde",
    "dusk-core/serde",
    "dusk-contract-standards/forge",
    "dep:dusk-data-driver",
    "dusk-data-driver/wasm-export",
    "dep:serde_json",
]
data-driver-js = ["data-driver", "dusk-data-driver/alloc"]
