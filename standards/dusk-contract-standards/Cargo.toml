[package]
name = "dusk-contract-standards"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
dusk-core = { workspace = true }
dusk-forge = { workspace = true }
bytecheck = { workspace = true }
rkyv = { workspace = true, features = ["size_32", "alloc", "validation"] }
serde = { workspace = true, optional = true }
serde_with = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[features]
contract = []
serde = ["dep:serde", "dep:serde_with", "dep:time", "dusk-core/serde"]

[dev-dependencies]
dusk-data-driver = { workspace = true, features = ["reader"] }
dusk-vm = { workspace = true }
proptest = "1.6.0"
rand = { workspace = true, features = ["std_rng"] }
serde_json = { workspace = true, features = ["std"] }
